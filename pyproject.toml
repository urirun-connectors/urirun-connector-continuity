[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-connector-continuity"
version = "0.1.0"
description = "Obnaża per-ticket niedopowiedzenia jako fakty URI: ready/verify/gap — fundament autonomii (gap://)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tom Sapletta" }]
dependencies = ["urirun>=0.4.14"]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "urirun-connector-watchdog @ git+https://github.com/urirun-connectors/urirun-connector-watchdog.git@main",
    "urirun-connector-work @ git+https://github.com/urirun-connectors/urirun-connector-work.git@main",
]

[project.entry-points."urirun.bindings"]
continuity = "urirun_connector_continuity.core:urirun_bindings"

[tool.setuptools.packages.find]
include = ["urirun_connector_continuity*"]
